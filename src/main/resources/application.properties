spring.application.name=gt-travels
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=jdbc:mysql://localhost:3306/gt_travels_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET:}
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:5}
app.security.account-lock-minutes=${ACCOUNT_LOCK_MINUTES:15}
app.security.email-verification-hours=${EMAIL_VERIFICATION_HOURS:24}
app.security.password-reset-hours=${PASSWORD_RESET_HOURS:1}
app.security.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:10}
app.security.cookie-secure=${COOKIE_SECURE:false}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.booking.seat-lock-minutes=${SEAT_LOCK_MINUTES:10}
app.booking.pending-expiry-minutes=${PENDING_EXPIRY_MINUTES:15}

app.fare.convenience-fee-per-seat=${CONVENIENCE_FEE_PER_SEAT:30}
app.fare.tax-percent=${FARE_TAX_PERCENT:5}
app.fare.default-boarding-charge=${DEFAULT_BOARDING_CHARGE:20}

server.port=${SERVER_PORT:8080}